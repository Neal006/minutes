apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    # Created before the minutes app, but Argo CD doesn't wait for child apps to be healthy: on the very
    # first bootstrap the ClusterIssuer may fail once until cert-manager's CRDs/webhook are up, and the
    # minutes app's retry policy re-syncs it within a few minutes.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.2
    helm:
      valuesObject:
        crds: { enabled: true }
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
