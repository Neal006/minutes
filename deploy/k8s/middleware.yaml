# Minutes has no login of its own, so Traefik (bundled with k3s) guards every request with basic auth
# over HTTPS. The htpasswd entry lives in the minutes-basic-auth secret (key: users).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
spec:
  basicAuth:
    secret: minutes-basic-auth
    removeHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
