# Production stack for one small VM (e.g. Oracle Cloud Always Free Ampere A1). See docs/DEPLOYMENT.md.
#   cp .env.example .env && edit      # keys, tunnel token, R2 credentials
#   docker compose run --rm litestream restore -if-replica-exists /data/minutes.db   # fresh VM only
#   docker compose up -d
services:
  app:
    image: ghcr.io/neal006/minutes:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - data:/data
    # No published ports on purpose: the app has no login of its own and is reachable only
    # through the Cloudflare Tunnel, where Cloudflare Access authenticates every request.

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [app]

  # Continuous SQLite replication to Cloudflare R2 (seconds of RPO, point-in-time restore).
  litestream:
    image: litestream/litestream:0.3.13
    restart: unless-stopped
    command: replicate
    env_file: .env
    volumes:
      - data:/data
      - ./litestream.yml:/etc/litestream.yml:ro

  # Nightly copy of playback audio to R2 (the DB is already covered by Litestream).
  audio-backup:
    image: rclone/rclone:1.71
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "-c", "while true; do rclone sync /data/audio r2:$${R2_BUCKET}/audio --exclude '*.chunk'; sleep 86400; done"]
    environment:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${R2_ENDPOINT}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY}
    volumes:
      - data:/data:ro

volumes:
  data:
